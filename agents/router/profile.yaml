# Hermes profile for the router microagent. Created with:
#   HERMES_HOME=$WORK/hermes-home hermes profile create router --description "$(head -2 agents/router/SOUL.md | tail -1)"
# then copy agents/router/SOUL.md into the profile and set the model below (verify keys with `router setup` / `hermes model`).
model:
  provider: custom
  base_url: http://127.0.0.1:8081/v1
  default: router-local
auxiliary:
  provider: main   # keep compression/titles/vision on the local model, nothing goes to the cloud
