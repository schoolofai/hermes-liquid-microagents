# Hermes profile for the receipts microagent. Created with:
#   HERMES_HOME=$WORK/hermes-home hermes profile create receipts --description "$(head -2 agents/receipts/SOUL.md | tail -1)"
# then copy agents/receipts/SOUL.md into the profile and set the model below (verify keys with `receipts setup` / `hermes model`).
model:
  provider: custom
  base_url: http://127.0.0.1:8083/v1
  default: receipts-local
auxiliary:
  provider: main   # keep compression/titles/vision on the local model, nothing goes to the cloud
